<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Orbit Hopper</title>
<!-- YouTube Playables SDK: diğer tüm oyun kodundan ÖNCE yüklenmeli -->
<script src="https://www.youtube.com/game_api/v1"></script>
<style>
  html,body{margin:0;height:100%;background:#0b1030;overflow:hidden;touch-action:none;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
  canvas{display:block;width:100%;height:100%;outline:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';

/* ------------------------------------------------------------------ *
 *  YouTube Playables SDK köprüsü
 * ------------------------------------------------------------------ */
var YT = (typeof ytgame !== 'undefined') ? ytgame : null;
var IN_YT = !!(YT && YT.IN_PLAYABLES_ENV);
function safe(fn) { try { return fn(); } catch (e) { return undefined; } }
function rnd(a, b) { return a + Math.random() * (b - a); }
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

window.addEventListener('error', function () {
  safe(function () { if (YT && YT.health) YT.health.logError(); });
});

/* ------------------------------------------------------------------ *
 *  Texts (English)
 * ------------------------------------------------------------------ */
var TXT = {
  en: { sub: 'Hop from planet to planet', start: 'Tap to start', best: 'Best',
        over: 'Game over', again: 'Tap to play again', newbest: 'New record!',
        perfect: 'Perfect!', hint: 'Tap to launch', loading: 'Loading…', stars: 'Stars' }
};
var L = TXT.en;

/* ------------------------------------------------------------------ *
 *  Canvas / ölçek
 * ------------------------------------------------------------------ */
var cv = document.getElementById('c');
var ctx = cv.getContext('2d');
var VW = 0, VH = 0, DPR = 1, S = 1, U = 1, bgGrad = null;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  VW = window.innerWidth || 360;
  VH = window.innerHeight || 640;
  cv.width = Math.round(VW * DPR);
  cv.height = Math.round(VH * DPR);
  S = Math.min(VW / 420, VH / 640);
  U = clamp(Math.min(VW / 360, VH / 640), 0.75, 1.7);
  bgGrad = ctx.createLinearGradient(0, 0, 0, VH);
  bgGrad.addColorStop(0, '#0a0e2e');
  bgGrad.addColorStop(0.55, '#1b1452');
  bgGrad.addColorStop(1, '#40195f');
}
window.addEventListener('resize', resize);

function wx(x) { return VW / 2 + x * S; }
function wy(y) { return VH * 0.68 + (y - camY) * S; }

/* ------------------------------------------------------------------ *
 *  Oyun durumu
 * ------------------------------------------------------------------ */
var state = 'loading';          // loading | menu | play | over
var paused = false, loaded = false;
var planets = [], ship = null, particles = [], popups = [], trail = [];
var score = 0, best = 0, starsTotal = 0, runStars = 0, genCount = 1;
var camY = 0, camTarget = 0, shake = 0, time = 0, overT = 0, flightT = 0, newBest = false;

var bgStars = [];
for (var i = 0; i < 90; i++) bgStars.push({ x: Math.random(), y: Math.random(), z: rnd(0.2, 1), s: rnd(0.6, 1.8), ph: rnd(0, 6.28) });

function diff() { return Math.min(score / 45, 1); }
function orbitSpeed() { return 135 + diff() * 65; }
function flightSpeed() { return 320 + diff() * 80; }

/* ------------------------------------------------------------------ *
 *  Gezegen üretimi
 * ------------------------------------------------------------------ */
function genPlanet() {
  var prev = planets[planets.length - 1];
  var d = Math.min(genCount / 45, 1);
  var dist = 150 + d * 55 + rnd(0, 28);
  var maxX = 115, nx = 0, ny = 0;
  for (var t = 0; t < 10; t++) {
    var ang = rnd(-0.9, 0.9);
    nx = prev.bx + Math.sin(ang) * dist;
    ny = prev.by - Math.cos(ang) * dist;
    if (Math.abs(nx) <= maxX) break;
  }
  nx = clamp(nx, -maxX, maxX);
  var moving = genCount >= 12 && Math.random() < Math.min(0.15 + d * 0.4, 0.5);
  var p = {
    bx: nx, by: ny, x: nx, y: ny,
    r: 47 - d * 14 + rnd(-4, 4), core: 11 + rnd(0, 5),
    hue: (genCount * 41) % 360, visited: false,
    moving: moving, amp: moving ? rnd(22, 42) : 0, ph: rnd(0, 6.28), spd: rnd(0.5, 1.0),
    star: null
  };
  if (Math.random() < 0.6) {
    var mx = (prev.bx + nx) / 2, my = (prev.by + ny) / 2;
    var off = rnd(-16, 16);
    p.star = { x: mx + off, y: my, taken: false, ph: rnd(0, 6.28) };
  }
  planets.push(p);
  genCount++;
}

function resetWorld() {
  var p0 = { bx: 0, by: 0, x: 0, y: 0, r: 47, core: 13, hue: 200, visited: true,
             moving: false, amp: 0, ph: 0, spd: 1, star: null };
  planets = [p0];
  genCount = 1;
  while (planets.length < 8) genPlanet();
  ship = { mode: 'orbit', p: p0, a: Math.PI * 0.5, orR: 47, x: 0, y: 47, vx: 0, vy: 0,
           dir: 1, lastP: p0, graceT: 0 };
  camY = 0; camTarget = 0;
  particles = []; popups = []; trail = [];
  score = 0; runStars = 0; newBest = false; time = 0; flightT = 0;
}

/* ------------------------------------------------------------------ *
 *  Ses (WebAudio, sentez)
 * ------------------------------------------------------------------ */
var actx = null, master = null, platAudio = true, userSnd = true;
function audioOn() { return platAudio && userSnd; }
function initAudio() {
  if (actx) return;
  try {
    var AC = window.AudioContext || window.webkitAudioContext;
    actx = new AC();
    master = actx.createGain();
    master.gain.value = 0.5;
    master.connect(actx.destination);
  } catch (e) { actx = null; }
}
function tone(freq, dur, type, vol, endFreq, delay) {
  if (!actx || !audioOn()) return;
  var t = actx.currentTime + (delay || 0);
  var o = actx.createOscillator(), g = actx.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(freq, t);
  if (endFreq) o.frequency.exponentialRampToValueAtTime(Math.max(30, endFreq), t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol || 0.2, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(master);
  o.start(t); o.stop(t + dur + 0.03);
}
function noiseBurst(dur, vol) {
  if (!actx || !audioOn()) return;
  var n = Math.floor(actx.sampleRate * dur);
  var buf = actx.createBuffer(1, n, actx.sampleRate), data = buf.getChannelData(0);
  for (var i = 0; i < n; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / n);
  var src = actx.createBufferSource(); src.buffer = buf;
  var f = actx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 900;
  var g = actx.createGain(); g.gain.value = vol || 0.3;
  src.connect(f); f.connect(g); g.connect(master); src.start();
}
var SCALE = [0, 2, 4, 7, 9, 12, 14, 16];
function sfxLaunch() { tone(420, 0.14, 'triangle', 0.18, 820); }
function sfxCapture() {
  var n = SCALE[score % SCALE.length];
  tone(330 * Math.pow(2, n / 12), 0.22, 'sine', 0.25);
  tone(660 * Math.pow(2, n / 12), 0.18, 'triangle', 0.08);
}
function sfxPerfect() { tone(1320, 0.18, 'sine', 0.12, null, 0.06); }
function sfxStar() { tone(988, 0.12, 'square', 0.1); tone(1319, 0.2, 'square', 0.1, null, 0.08); }
function sfxCrash() { noiseBurst(0.45, 0.35); tone(220, 0.5, 'sawtooth', 0.16, 45); }

function toggleSound() {
  userSnd = !userSnd;
  saveGame();
  if (userSnd) tone(660, 0.12, 'sine', 0.15);
}

/* ------------------------------------------------------------------ *
 *  Kayıt (YouTube saveData / loadData)
 * ------------------------------------------------------------------ */
var LS_KEY = 'orbit_hopper_save_v1';
function loadSave() {
  return new Promise(function (resolve) {
    if (IN_YT) {
      var p = safe(function () { return YT.game.loadData(); });
      if (p && p.then) p.then(function (s) { resolve(s || ''); }, function () { resolve(''); });
      else resolve('');
    } else {
      resolve(safe(function () { return localStorage.getItem(LS_KEY); }) || '');
    }
  });
}
function applySave(s) {
  try {
    if (!s) return;
    var d = JSON.parse(s);
    best = d.best | 0; starsTotal = d.stars | 0;
    if (d.snd === false) userSnd = false;
  } catch (e) {}
}
function saveGame() {
  if (!loaded) return;     // loadData bitmeden saveData çağrılmamalı
  var s = JSON.stringify({ v: 1, best: best, stars: starsTotal, snd: userSnd });
  if (IN_YT) {
    var r = safe(function () { return YT.game.saveData(s); });
    if (r && r.catch) r.catch(function () {});
  } else {
    safe(function () { localStorage.setItem(LS_KEY, s); });
  }
}

/* ------------------------------------------------------------------ *
 *  Efektler
 * ------------------------------------------------------------------ */
function burst(x, y, n, hue, speed, life) {
  for (var i = 0; i < n; i++) {
    var a = rnd(0, 6.2832), v = rnd(0.3, 1) * speed;
    particles.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v,
                     life: rnd(0.5, 1) * life, max: life, size: rnd(1.5, 3.5), hue: hue });
  }
}
function popup(x, y, text, color) { popups.push({ x: x, y: y, text: text, color: color, t: 0 }); }

/* ------------------------------------------------------------------ *
 *  Oyun mantığı
 * ------------------------------------------------------------------ */
function startGame() {
  resetWorld();
  state = 'play';
}

function launch() {
  var sh = ship;
  if (sh.mode !== 'orbit') return;
  var tx = -Math.sin(sh.a) * sh.dir, ty = Math.cos(sh.a) * sh.dir, v = flightSpeed();
  sh.vx = tx * v; sh.vy = ty * v;
  sh.mode = 'fly'; sh.lastP = sh.p; sh.graceT = 0.35; flightT = 0;
  sfxLaunch();
  burst(sh.x, sh.y, 6, 200, 60, 0.4);
}

function capture(p, dx, dy, d) {
  var sh = ship;
  var cross = dx * sh.vy - dy * sh.vx;
  var sp = Math.hypot(sh.vx, sh.vy) || 1;
  var inward = -(dx * sh.vx + dy * sh.vy) / (d * sp || 1);   // 1 = tam merkeze doğru
  sh.dir = cross >= 0 ? 1 : -1;
  sh.a = Math.atan2(dy, dx);
  sh.orR = d; sh.p = p; sh.lastP = p; sh.mode = 'orbit';
  if (!p.visited) {
    p.visited = true;
    var gain = 1, perfect = inward > 0.9;
    if (perfect) gain = 2;
    score += gain;
    sfxCapture();
    if (perfect) { sfxPerfect(); popup(p.x, p.y - p.r - 18, L.perfect + ' +2', '#ffe27a'); }
    else popup(p.x, p.y - p.r - 18, '+1', '#ffffff');
    burst(p.x, p.y, perfect ? 22 : 12, p.hue, 120, 0.7);
    if (score > best) { best = score; if (!newBest) newBest = true; }
    while (planets.length < 8 + planets.indexOf(p)) genPlanet();
    planets = planets.filter(function (q) { return q === p || q.y < p.y + 700; });
    while (planets.length < 7) genPlanet();
  } else {
    sfxCapture();
  }
}

function die() {
  var sh = ship;
  sh.mode = 'dead';
  state = 'over'; overT = 0; shake = 16;
  sfxCrash();
  burst(sh.x, sh.y, 36, 20, 220, 0.9);
  safe(function () { if (navigator.vibrate) navigator.vibrate(60); });
  if (score > best) best = score;
  starsTotal += runStars;
  saveGame();
  safe(function () {
    if (IN_YT && YT.engagement && YT.engagement.sendScore) {
      var r = YT.engagement.sendScore({ value: score });
      if (r && r.catch) r.catch(function () {});
    }
  });
}

function update(dt) {
  time += dt;
  for (var i = 0; i < planets.length; i++) {
    var p = planets[i];
    if (p.moving) p.x = p.bx + p.amp * Math.sin(time * p.spd + p.ph);
  }

  var sh = ship;
  if (sh && sh.mode === 'orbit') {
    var op = sh.p;
    sh.a += (orbitSpeed() / op.r) * sh.dir * dt * (state === 'menu' ? 0.7 : 1);
    sh.orR += (op.r - sh.orR) * Math.min(1, dt * 9);
    sh.x = op.x + Math.cos(sh.a) * sh.orR;
    sh.y = op.y + Math.sin(sh.a) * sh.orR;
    camTarget = op.y;
  } else if (sh && sh.mode === 'fly') {
    flightT += dt; sh.graceT -= dt;
    sh.x += sh.vx * dt; sh.y += sh.vy * dt;
    camTarget = Math.min(sh.y, sh.lastP ? sh.lastP.y : sh.y);

    for (var j = 0; j < planets.length; j++) {
      var q = planets[j];
      if (q === sh.lastP && sh.graceT > 0) continue;
      var dx = sh.x - q.x, dy = sh.y - q.y, dd = Math.hypot(dx, dy);
      if (dd < q.r + 3) { capture(q, dx, dy, dd); break; }
    }
    if (sh.mode === 'fly') {
      for (var k = 0; k < planets.length; k++) {
        var s = planets[k].star;
        if (s && !s.taken && Math.hypot(sh.x - s.x, sh.y - s.y) < 20) {
          s.taken = true; runStars++; score++;
          if (score > best) { best = score; newBest = true; }
          sfxStar(); burst(s.x, s.y, 14, 48, 140, 0.6);
          popup(s.x, s.y - 14, '★ +1', '#ffd84a');
        }
      }
      var sx = wx(sh.x), sy = wy(sh.y);
      if (sy > VH + 40 || sx < -40 || sx > VW + 40 || sy < -220 || flightT > 4.2) die();
    }
  }

  if (sh && sh.mode !== 'dead') {
    var lt = trail[trail.length - 1];
    if (!lt || Math.hypot(lt.x - sh.x, lt.y - sh.y) > 2.5) {
      trail.push({ x: sh.x, y: sh.y });
      if (trail.length > 26) trail.shift();
    }
  } else if (trail.length) trail.shift();

  camY += (camTarget - camY) * Math.min(1, dt * 4.5);
  shake = Math.max(0, shake - 40 * dt);
  if (state === 'over') overT += dt;

  for (var a = particles.length - 1; a >= 0; a--) {
    var pt = particles[a];
    pt.life -= dt; pt.x += pt.vx * dt; pt.y += pt.vy * dt;
    pt.vx *= 0.97; pt.vy *= 0.97;
    if (pt.life <= 0) particles.splice(a, 1);
  }
  for (var b = popups.length - 1; b >= 0; b--) {
    popups[b].t += dt;
    if (popups[b].t > 1.1) popups.splice(b, 1);
  }
}

/* ------------------------------------------------------------------ *
 *  Çizim
 * ------------------------------------------------------------------ */
function text(str, x, y, size, color, align, weight, alpha) {
  ctx.font = (weight || '700') + ' ' + size + 'px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';
  ctx.textAlign = align || 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = color;
  ctx.globalAlpha = alpha == null ? 1 : alpha;
  ctx.fillText(str, x, y);
  ctx.globalAlpha = 1;
}
function rrect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawBackground() {
  ctx.fillStyle = bgGrad || '#0b1030';
  ctx.fillRect(0, 0, VW, VH);
  for (var i = 0; i < bgStars.length; i++) {
    var s = bgStars[i];
    var sy = (((s.y * VH - camY * S * s.z * 0.18) % VH) + VH) % VH;
    var tw = 0.55 + 0.45 * Math.sin(time * 2 + s.ph);
    ctx.globalAlpha = (0.25 + s.z * 0.6) * tw;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(s.x * VW, sy, s.s * s.z * Math.max(S, 0.8), 0, 6.2832); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawPlanet(p, isCur) {
  var px = wx(p.x), py = wy(p.y), R = p.r * S, c = p.core * S;
  if (px < -R - 60 || px > VW + R + 60 || py < -R - 60 || py > VH + R + 60) return;

  ctx.save();
  ctx.lineWidth = (isCur ? 2.6 : 1.6) * Math.max(S, 0.8);
  ctx.strokeStyle = isCur ? 'rgba(255,255,255,0.75)' : (p.visited ? 'rgba(255,255,255,0.2)' : 'rgba(170,200,255,0.42)');
  if (!isCur) { ctx.setLineDash([7 * S, 9 * S]); ctx.lineDashOffset = -time * 14 * S; }
  ctx.beginPath(); ctx.arc(px, py, R, 0, 6.2832); ctx.stroke();
  ctx.restore();

  var gl = ctx.createRadialGradient(px, py, c * 0.6, px, py, c * 3.2);
  gl.addColorStop(0, 'hsla(' + p.hue + ',90%,60%,0.45)');
  gl.addColorStop(1, 'hsla(' + p.hue + ',90%,60%,0)');
  ctx.fillStyle = gl;
  ctx.beginPath(); ctx.arc(px, py, c * 3.2, 0, 6.2832); ctx.fill();

  var bd = ctx.createRadialGradient(px - c * 0.35, py - c * 0.35, c * 0.1, px, py, c);
  bd.addColorStop(0, 'hsl(' + p.hue + ',85%,78%)');
  bd.addColorStop(1, 'hsl(' + p.hue + ',70%,38%)');
  ctx.fillStyle = bd;
  ctx.beginPath(); ctx.arc(px, py, c, 0, 6.2832); ctx.fill();
}

function drawStarItem(s) {
  var x = wx(s.x), y = wy(s.y), r = (9 + Math.sin(time * 5 + s.ph) * 1.5) * S;
  if (y < -30 || y > VH + 30) return;
  ctx.save();
  ctx.shadowColor = '#ffd84a'; ctx.shadowBlur = 12;
  ctx.fillStyle = '#ffd84a';
  ctx.beginPath();
  for (var i = 0; i < 10; i++) {
    var rr = (i % 2) ? r * 0.45 : r, ang = -Math.PI / 2 + i * Math.PI / 5 + time * 0.8;
    var px = x + Math.cos(ang) * rr, py = y + Math.sin(ang) * rr;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

function drawShip() {
  var sh = ship;
  if (!sh) return;
  for (var i = 1; i < trail.length; i++) {
    var a = trail[i - 1], b = trail[i], k = i / trail.length;
    ctx.strokeStyle = 'rgba(160,220,255,' + (k * 0.7).toFixed(3) + ')';
    ctx.lineWidth = (1 + k * 4) * Math.max(S, 0.8);
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(wx(a.x), wy(a.y)); ctx.lineTo(wx(b.x), wy(b.y)); ctx.stroke();
  }
  if (sh.mode === 'dead') return;
  var x = wx(sh.x), y = wy(sh.y), r = 6 * Math.max(S, 0.85);
  var g = ctx.createRadialGradient(x, y, 0, x, y, r * 3.2);
  g.addColorStop(0, 'rgba(180,235,255,0.55)'); g.addColorStop(1, 'rgba(180,235,255,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r * 3.2, 0, 6.2832); ctx.fill();
  ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.fill();
}

function drawSoundButton() {
  var r = 20 * U, x = 14 * U + r, y = VH - 14 * U - r;
  var on = audioOn();
  ctx.fillStyle = 'rgba(255,255,255,0.12)';
  ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.fill();
  ctx.fillStyle = '#ffffff'; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2 * U; ctx.lineCap = 'round';
  var u = U;
  ctx.beginPath();
  ctx.moveTo(x - 9 * u, y - 3.5 * u); ctx.lineTo(x - 4 * u, y - 3.5 * u); ctx.lineTo(x + 1 * u, y - 8 * u);
  ctx.lineTo(x + 1 * u, y + 8 * u); ctx.lineTo(x - 4 * u, y + 3.5 * u); ctx.lineTo(x - 9 * u, y + 3.5 * u);
  ctx.closePath(); ctx.fill();
  if (on) {
    ctx.beginPath(); ctx.arc(x + 1 * u, y, 6 * u, -0.9, 0.9); ctx.stroke();
    ctx.beginPath(); ctx.arc(x + 1 * u, y, 10 * u, -0.9, 0.9); ctx.stroke();
  } else {
    ctx.beginPath(); ctx.moveTo(x + 5 * u, y - 5 * u); ctx.lineTo(x + 12 * u, y + 5 * u);
    ctx.moveTo(x + 12 * u, y - 5 * u); ctx.lineTo(x + 5 * u, y + 5 * u); ctx.stroke();
  }
}
function soundBtnHit(px, py) {
  var r = 20 * U, x = 14 * U + r, y = VH - 14 * U - r;
  return Math.hypot(px - x, py - y) < r + 12;
}

function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawBackground();

  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);

  for (var i = 0; i < planets.length; i++) {
    drawPlanet(planets[i], ship && ship.mode === 'orbit' && ship.p === planets[i]);
  }
  for (var j = 0; j < planets.length; j++) {
    if (planets[j].star && !planets[j].star.taken) drawStarItem(planets[j].star);
  }
  drawShip();

  for (var k = 0; k < particles.length; k++) {
    var pt = particles[k];
    ctx.globalAlpha = clamp(pt.life / pt.max, 0, 1);
    ctx.fillStyle = 'hsl(' + pt.hue + ',90%,70%)';
    ctx.beginPath(); ctx.arc(wx(pt.x), wy(pt.y), pt.size * Math.max(S, 0.8), 0, 6.2832); ctx.fill();
  }
  ctx.globalAlpha = 1;

  for (var m = 0; m < popups.length; m++) {
    var po = popups[m], pa = 1 - po.t / 1.1;
    text(po.text, wx(po.x), wy(po.y) - po.t * 30 * S, 18 * U, po.color, 'center', '800', clamp(pa * 1.5, 0, 1));
  }
  ctx.restore();

  drawHud();
}

function drawHud() {
  var cx = VW / 2;
  if (state === 'loading') {
    text('ORBIT HOPPER', cx, VH * 0.3, 36 * U, '#ffffff', 'center', '800');
    text(L.loading, cx, VH * 0.3 + 40 * U, 16 * U, '#b9c3ff', 'center', '500', 0.8);
    return;
  }

  if (state === 'menu') {
    ctx.save();
    ctx.shadowColor = '#7fb2ff'; ctx.shadowBlur = 24 * U;
    text('ORBIT', cx, VH * 0.19, 50 * U, '#ffffff', 'center', '900');
    text('HOPPER', cx, VH * 0.19 + 50 * U, 50 * U, '#9fd0ff', 'center', '900');
    ctx.restore();
    text(L.sub, cx, VH * 0.19 + 98 * U, 16 * U, '#c5ccff', 'center', '500', 0.9);
    var pul = 0.55 + 0.45 * Math.sin(time * 4);
    text(L.start, cx, VH * 0.86, 20 * U, '#ffffff', 'center', '700', pul);
    if (best > 0) text(L.best + ': ' + best, cx, VH * 0.86 + 32 * U, 15 * U, '#ffd84a', 'center', '600', 0.95);
    drawSoundButton();
    return;
  }

  // oyun içi skor
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 8;
  text(String(score), cx, 62 * U, 58 * U, '#ffffff', 'center', '800');
  ctx.restore();
  text(L.best + ' ' + best, cx, 62 * U + 40 * U, 14 * U, '#b9c3ff', 'center', '600', 0.85);
  if (runStars > 0) text('★ ' + runStars, cx, 62 * U + 62 * U, 14 * U, '#ffd84a', 'center', '700', 0.95);

  if (state === 'play' && score === 0 && ship && ship.mode === 'orbit') {
    var pu = 0.55 + 0.45 * Math.sin(time * 4);
    text(L.hint, cx, VH * 0.89, 19 * U, '#ffffff', 'center', '700', pu);
  }

  if (state === 'over') {
    var fa = clamp((overT - 0.35) / 0.35, 0, 1);
    if (fa > 0) {
      ctx.globalAlpha = fa * 0.55; ctx.fillStyle = '#05061a'; ctx.fillRect(0, 0, VW, VH); ctx.globalAlpha = 1;
      var pw = Math.min(VW * 0.82, 320 * U), ph = 230 * U, px = cx - pw / 2, py = VH * 0.5 - ph / 2 - 10 * U;
      ctx.globalAlpha = fa;
      ctx.fillStyle = 'rgba(24,20,70,0.92)'; rrect(px, py, pw, ph, 22 * U); ctx.fill();
      ctx.strokeStyle = 'rgba(160,190,255,0.35)'; ctx.lineWidth = 2; ctx.stroke();
      ctx.globalAlpha = 1;
      text(L.over, cx, py + 34 * U, 22 * U, '#ffffff', 'center', '800', fa);
      text(String(score), cx, py + 92 * U, 62 * U, '#ffffff', 'center', '900', fa);
      if (newBest && score > 0) text(L.newbest, cx, py + 138 * U, 18 * U, '#ffd84a', 'center', '800', fa);
      else text(L.best + ': ' + best, cx, py + 138 * U, 16 * U, '#b9c3ff', 'center', '600', fa);
      if (runStars > 0) text('★ ' + runStars + ' ' + L.stars, cx, py + 164 * U, 15 * U, '#ffd84a', 'center', '700', fa);
      if (overT > 0.7) {
        var pp = 0.55 + 0.45 * Math.sin(time * 4);
        text(L.again, cx, py + ph - 26 * U, 16 * U, '#ffffff', 'center', '700', pp * fa);
      }
    }
  }
  drawSoundButton();
}

/* ------------------------------------------------------------------ *
 *  Girdi
 * ------------------------------------------------------------------ */
function onTap(px, py) {
  initAudio();
  if (actx && actx.state === 'suspended') safe(function () { actx.resume(); });
  if (!loaded || paused) return;
  if (soundBtnHit(px, py)) { toggleSound(); return; }
  if (state === 'menu') startGame();
  else if (state === 'play') launch();
  else if (state === 'over' && overT > 0.7) startGame();
}
cv.addEventListener('pointerdown', function (e) { e.preventDefault(); onTap(e.clientX, e.clientY); });
cv.addEventListener('contextmenu', function (e) { e.preventDefault(); });
window.addEventListener('keydown', function (e) {
  if (e.code === 'Space' || e.code === 'Enter' || e.code === 'ArrowUp') {
    e.preventDefault();
    if (!e.repeat) onTap(-999, -999);
  }
});

/* ------------------------------------------------------------------ *
 *  Duraklat / Devam (yalnızca Playables SDK)
 * ------------------------------------------------------------------ */
safe(function () {
  if (!YT || !YT.system) return;
  YT.system.onPause(function () {
    paused = true;
    saveGame();
    if (actx) safe(function () { actx.suspend(); });
  });
  YT.system.onResume(function () {
    paused = false; lastTs = 0;
    if (actx && audioOn()) safe(function () { actx.resume(); });
  });
  platAudio = YT.system.isAudioEnabled() !== false;
  YT.system.onAudioEnabledChange(function (enabled) { platAudio = !!enabled; });
});

/* ------------------------------------------------------------------ *
 *  Ana döngü ve açılış
 * ------------------------------------------------------------------ */
var lastTs = 0;
function loop(ts) {
  requestAnimationFrame(loop);
  if (!lastTs) lastTs = ts;
  var dt = Math.min(0.05, (ts - lastTs) / 1000);
  lastTs = ts;
  if (paused) return;
  update(dt);
  draw();
}

resize();
resetWorld();
draw();                                           // ilk kare
safe(function () { if (YT && YT.game) YT.game.firstFrameReady(); });
requestAnimationFrame(loop);

loadSave().then(function (s) {
  applySave(s);
  loaded = true;
  state = 'menu';
  requestAnimationFrame(function () {
    draw();
    safe(function () { if (YT && YT.game) YT.game.gameReady(); });   // menü hazır, etkileşime açık
  });
});

})();
</script>
